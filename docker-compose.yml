services:
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: almoxarifado
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    # Garante que o Flask só inicie quando o MySQL passar no teste de healthcheck
    depends_on:
      db:
        condition: service_healthy
